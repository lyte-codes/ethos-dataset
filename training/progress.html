<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethos — live</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ground:#E9EEED; --surface:#FBFDFC; --edge:#CBD6D4;
    --text:#0E1719; --muted:#57676A;
    --accent:#12766B; --accent-soft:#12766B22;
    --warn:#8C5C0E; --crit:#A33528; --grid:#0E171911;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#10161A; --surface:#172127; --edge:#26343A;
      --text:#DCE5E4; --muted:#88999A;
      --accent:#3FB0A0; --accent-soft:#3FB0A028;
      --warn:#D8973C; --crit:#D9614F; --grid:#DCE5E40E;
    }
  }

  body {
    background: var(--ground); color: var(--text);
    font-family: var(--sans); line-height: 1.55;
    padding: clamp(1.25rem,4vw,3rem) 1.25rem 4rem;
  }

  .wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.6rem; }

  .label {
    font-family: var(--mono); font-size: .685rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }

  header { display: flex; flex-direction: column; gap: .6rem; }
  .runline { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem .9rem; }

  h1 {
    font-family: var(--mono); font-size: clamp(1.35rem,4vw,1.75rem);
    font-weight: 600; letter-spacing: -.01em; text-wrap: balance;
  }

  .pill {
    font-family: var(--mono); font-size: .7rem; letter-spacing: .08em;
    text-transform: uppercase; padding: .2rem .55rem; border-radius: 2px;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    display: inline-flex; align-items: center; gap: .4rem;
  }
  .pill.stopped {
    background: color-mix(in srgb, var(--crit) 14%, transparent);
    color: var(--crit); border-color: color-mix(in srgb, var(--crit) 35%, transparent);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  @media (prefers-reduced-motion: no-preference) {
    .pill:not(.stopped) .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  }

  header p { color: var(--muted); font-size: .92rem; max-width: 62ch; }

  .card {
    background: var(--surface); border: 1px solid var(--edge); border-radius: 3px;
    padding: 1.25rem; display: flex; flex-direction: column; gap: .4rem;
  }
  [hidden] { display: none !important; }

  .queue-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .5rem; }

  .toggle {
    font-family: var(--mono); font-size: .72rem; color: var(--muted);
    background: none; border: 1px solid var(--edge); border-radius: 2px;
    padding: .3rem .6rem; cursor: pointer;
  }
  .toggle[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- queue rows ---- */
  .item { border-bottom: 1px solid var(--edge); }
  .item:last-child { border-bottom: none; }

  .item-head {
    display: grid; grid-template-columns: 1.4rem 1fr auto auto; gap: .5rem .85rem;
    align-items: baseline; padding: .7rem .3rem; width: 100%;
    background: none; border: none; color: inherit; font: inherit; text-align: left;
    cursor: pointer;
  }
  .item-head:hover { background: color-mix(in srgb, var(--text) 3%, transparent); }
  .item-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .mark { font-family: var(--mono); text-align: center; color: var(--muted); }
  .item.running .mark, .item.done .mark { color: var(--accent); }
  .item.failed .mark { color: var(--crit); }

  .t { font-size: .92rem; font-weight: 600; }
  .t small { display: block; font-family: var(--mono); font-weight: 400; font-size: .68rem; color: var(--muted); letter-spacing: .03em; }

  .state {
    font-family: var(--mono); font-size: .68rem; color: var(--muted);
    letter-spacing: .06em; text-transform: uppercase;
  }
  .item.running .state { color: var(--accent); }
  .item.failed .state { color: var(--crit); }

  .chev { font-family: var(--mono); color: var(--muted); transition: transform .15s ease; }
  .item.open .chev { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

  .item-body { padding: .3rem .3rem 1.1rem 2.75rem; display: flex; flex-direction: column; gap: .9rem; }

  /* ---- shared detail bits ---- */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
    gap: 1px; background: var(--edge); border: 1px solid var(--edge);
    border-radius: 3px; overflow: hidden;
  }
  .stat { background: var(--surface); padding: .7rem .9rem; display: flex; flex-direction: column; gap: .2rem; }
  .stat .v { font-family: var(--mono); font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .sub { font-family: var(--mono); font-size: .66rem; color: var(--muted); }

  .track { position: relative; height: 20px; border-radius: 2px; overflow: hidden;
           background: color-mix(in srgb, var(--text) 6%, transparent); }
  .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px 0 0 2px; }

  .chart-scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 420px; height: auto; }

  table { border-collapse: collapse; font-family: var(--mono); font-size: .84rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .4rem 1.1rem .4rem 0; border-bottom: 1px solid var(--edge); }
  th { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  td.best { color: var(--accent); font-weight: 600; }
  td.warn { color: var(--warn); }

  .transcript {
    font-size: .9rem; background: color-mix(in srgb, var(--text) 4%, transparent);
    border-left: 3px solid var(--accent); padding: .7rem .9rem; border-radius: 2px;
    max-width: 62ch;
  }
  .note { font-size: .8rem; color: var(--muted); max-width: 64ch; }
  code { font-family: var(--mono); font-size: .85em; background: color-mix(in srgb, var(--text) 7%, transparent);
         padding: .06em .3em; border-radius: 2px; }

  .term-btn {
    align-self: flex-start;
    font-family: var(--mono); font-size: .7rem; color: var(--muted);
    background: none; border: 1px solid var(--edge); border-radius: 2px;
    padding: .28rem .6rem; cursor: pointer;
  }
  .term-btn[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .term-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .term {
    font-family: var(--mono); font-size: .72rem; line-height: 1.5;
    background: #0B1114; color: #C7D4D2;
    border: 1px solid var(--edge); border-radius: 3px;
    padding: .8rem .9rem; max-height: 320px; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
  }

  footer {
    font-family: var(--mono); font-size: .7rem; color: var(--muted); line-height: 1.7;
    border-top: 1px solid var(--edge); padding-top: 1rem;
    display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }
  #freshness { color: var(--accent); }
  #freshness.stale { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="label">Ethos · outbound booking agent</div>
    <div class="runline">
      <h1>Qwen2.5-1.5B → booking agent</h1>
      <span class="pill" id="livepill"><span class="dot"></span><span id="livetext">Connecting</span></span>
    </div>
    <p>
      Everything the machine has done or is queued to do, one row each. Click a row for its
      data; finished work stays tucked away unless you ask for it.
    </p>
  </header>

  <section class="card">
    <div class="queue-head">
      <div class="label">Queue</div>
      <button class="toggle" id="showdone" aria-pressed="false">show completed (0)</button>
    </div>
    <div id="queue"></div>
  </section>

  <footer>
    <span id="freshness">—</span>
    <span id="src">reads the run logs · refreshes every 30s</span>
  </footer>

</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const el = id => document.getElementById(id);
const POLL_MS = 30000;

let lastFetch = null;
let queueData = [];
const open = new Set(JSON.parse(localStorage.getItem("ethos-open") || "[]"));
let showDone = localStorage.getItem("ethos-showdone") === "1";

/* ---------- small helpers ---------- */

function svgAdd(svg, tag, attrs, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  svg.appendChild(n);
  return n;
}

function lossChart(host, log, maxSteps) {
  const points = (log || []).filter(e => e.loss != null);
  if (points.length < 2) return;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 720 210");
  const W = 720, H = 210, L = 46, R = 14, T = 14, B = 26;
  const total = maxSteps || points.at(-1).step;
  const xs = s => L + (s / total) * (W - L - R);
  const losses = points.map(e => e.loss);
  const lo = Math.floor(Math.min(...losses) * 10) / 10 - 0.05;
  const hi = Math.ceil(Math.max(...losses) * 10) / 10 + 0.05;
  const ys = v => T + (1 - (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo)) * (H - T - B);

  for (let v = lo; v <= hi + 1e-9; v += (hi - lo) > 0.6 ? 0.2 : 0.1) {
    svgAdd(svg, "line", { x1: L, y1: ys(v), x2: W - R, y2: ys(v), stroke: "var(--grid)" });
    svgAdd(svg, "text", { x: L - 8, y: ys(v) + 3.5, "text-anchor": "end", fill: "var(--muted)",
                          "font-size": 10, "font-family": "var(--mono)" }, v.toFixed(1));
  }
  const pts = points.map(e => [xs(e.step), ys(e.loss)]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  svgAdd(svg, "path", { d: `${path} L ${pts.at(-1)[0]} ${H - B} L ${pts[0][0]} ${H - B} Z`,
                        fill: "var(--accent-soft)", stroke: "none" });
  svgAdd(svg, "path", { d: path, fill: "none", stroke: "var(--accent)", "stroke-width": 2,
                        "stroke-linejoin": "round" });
  const lp = pts.at(-1);
  svgAdd(svg, "circle", { cx: lp[0], cy: lp[1], r: 4, fill: "var(--accent)" });
  svgAdd(svg, "text", { x: lp[0] - 6, y: lp[1] - 10, "text-anchor": "end", fill: "var(--text)",
                        "font-size": 12, "font-weight": 600, "font-family": "var(--mono)" },
         points.at(-1).loss.toFixed(3));
  svgAdd(svg, "line", { x1: L, y1: H - B, x2: W - R, y2: H - B, stroke: "var(--edge)" });
  [0, Math.round(total / 2), total].forEach(s =>
    svgAdd(svg, "text", { x: xs(s), y: H - B + 15, "text-anchor": "middle", fill: "var(--muted)",
                          "font-size": 10, "font-family": "var(--mono)" }, s));
  const holder = document.createElement("div");
  holder.className = "chart-scroll";
  holder.appendChild(svg);
  host.appendChild(holder);
}

function statGrid(host, cells) {
  const grid = document.createElement("div");
  grid.className = "stats";
  for (const [label, value, sub] of cells) {
    const cell = document.createElement("div");
    cell.className = "stat";
    cell.innerHTML = `<span class="label">${label}</span><span class="v">${value}</span>` +
                     (sub ? `<span class="sub">${sub}</span>` : "");
    grid.appendChild(cell);
  }
  host.appendChild(grid);
}

function progressBar(host, fraction) {
  const track = document.createElement("div");
  track.className = "track";
  track.innerHTML = `<div class="fill" style="width:${(fraction * 100).toFixed(1)}%"></div>`;
  host.appendChild(track);
}

function noteEl(host, text) {
  const p = document.createElement("p");
  p.className = "note";
  p.innerHTML = text;
  host.appendChild(p);
}

/* ---------- per-kind detail renderers ---------- */

const RENDER = {
  generation(host, item) {
    const g = item.generation || {};
    progressBar(host, (g.conversations || 0) / (g.target || 1));
    statGrid(host, [
      ["Conversations", g.conversations ?? "—", `of ${g.target ?? "—"}`],
      ["Examples", g.examples ?? "—", "turn-level rows"],
      ["Gate pass", g.pass_rate != null ? (g.pass_rate * 100).toFixed(0) + "%" : "—",
       `${g.failed ?? 0} rejected`],
    ]);
  },

  sft(host, item) {
    if (item.score) {
      statGrid(host, [
        ["Held-out loss", item.score.heldout_loss.toFixed(3), "lower is better"],
        ["Train loss", item.score.train_loss.toFixed(3), ""],
        ["Gap", (item.score.gap >= 0 ? "+" : "") + item.score.gap.toFixed(3), "memorisation signal"],
      ]);
    }
    lossChart(host, item.log, null);
  },

  dpo(host, item) {
    const d = item.dpo || {};
    if (d.training) {
      const t = d.training;
      progressBar(host, t.step / t.max_steps);
      statGrid(host, [
        ["Step", t.step, `of ${t.max_steps}`],
        ["Rate", t.sec_per_step.toFixed(1) + "s", "per optimizer step"],
        ["Remaining", t.remaining, ""],
      ]);
      noteEl(host, "Each step covers 8 accumulated pairs, forward and backward — " +
                   "precompute items were single forwards, which is why the rates differ so much.");
    } else if (d.precompute) {
      const pc = d.precompute;
      progressBar(host, pc.step / pc.max_steps);
      statGrid(host, [
        ["Reference log-probs", pc.step, `of ${pc.max_steps} pairs`],
        ["Rate", pc.sec_per_step.toFixed(1) + "s", "per pair"],
        ["Remaining", pc.remaining, "then 178 training steps"],
      ]);
    }
    if (item.score) {
      noteEl(host, `Held-out loss <code>${item.score.heldout_loss.toFixed(3)}</code> — read this ` +
                   "with care: DPO optimises the chosen-vs-rejected margin, not likelihood, so a " +
                   "worse held-out loss can accompany a better model. Preference accuracy below is " +
                   "the judgement that counts.");
    }
    if ((d.losses || []).length >= 2) lossChart(host, d.losses, null);
  },

  asr(host, item) {
    const a = item.asr || {};
    if (a.transcript) {
      const q = document.createElement("div");
      q.className = "transcript";
      q.textContent = a.transcript;
      host.appendChild(q);
      noteEl(host, "Whisper medium.en, fp32 on purpose — half precision on MPS has a history of " +
                   "silently wrong transcripts, and a wrong phone number is the failure this " +
                   "system exists to prevent.");
    } else {
      noteEl(host, "Runs the moment the GPU frees: transcribes a generated call line " +
                   "(<code>audio-samples/1.mp3</code>) as the first end-to-end test of the " +
                   "speech-to-text component from docs/CALLS.md.");
    }
  },

  eval(host, item) {
    const scores = item.scores || {};
    const names = Object.keys(scores);
    if (!names.length) {
      noteEl(host, "Scores v4, v6 and v5 on the 9 conversations nothing trained on. " +
                   "The gap between train and held-out loss is what separates learning from memorising.");
      return;
    }
    const bestHeld = Math.min(...names.map(n => scores[n].heldout_loss));
    const widestGap = Math.max(...names.map(n => scores[n].gap));
    const table = document.createElement("table");
    table.innerHTML = "<tr><th>model</th><th>train</th><th>held-out</th><th>gap</th></tr>" +
      names.map(n => {
        const s = scores[n];
        return `<tr><td>${n}</td><td>${s.train_loss.toFixed(3)}</td>` +
               `<td class="${s.heldout_loss === bestHeld ? "best" : ""}">${s.heldout_loss.toFixed(3)}</td>` +
               `<td class="${s.gap === widestGap ? "warn" : ""}">${s.gap >= 0 ? "+" : ""}${s.gap.toFixed(3)}</td></tr>`;
      }).join("");
    host.appendChild(table);
    noteEl(host, "Lowest held-out loss is the model that generalises best, whatever the training " +
                 "losses say. A wide gap is not a worse score — it is the signature of leaning on " +
                 "data seen before.");
  },

  prefeval(host, item) {
    const prefs = item.prefs || {};
    const names = Object.keys(prefs);
    if (!names.length) {
      noteEl(host, "The metric that actually judges DPO: given a held-out conversation, does the " +
                   "model prefer the response that copies the brief over one with a corrupted " +
                   "detail? Reported overall and broken down by what was corrupted — phone digits " +
                   "being the failure that matters most.");
      return;
    }
    const kinds = [...new Set(names.flatMap(n => Object.keys(prefs[n].by_corruption || {})))];
    const bestAcc = Math.max(...names.map(n => prefs[n].accuracy ?? 0));
    const table = document.createElement("table");
    table.innerHTML =
      `<tr><th>model</th><th>accuracy</th><th>margin</th>${kinds.map(k => `<th>${k}</th>`).join("")}</tr>` +
      names.map(n => {
        const s = prefs[n];
        return `<tr><td>${n}</td>` +
          `<td class="${s.accuracy === bestAcc ? "best" : ""}">${(s.accuracy * 100).toFixed(1)}%</td>` +
          `<td>${s.mean_margin >= 0 ? "+" : ""}${(s.mean_margin ?? 0).toFixed(3)}</td>` +
          kinds.map(k => {
            const rate = (s.by_corruption || {})[k];
            return `<td>${rate != null ? (rate * 100).toFixed(0) + "%" : "—"}</td>`;
          }).join("") + "</tr>";
      }).join("");
    host.appendChild(table);
  },

  composite(host, item) {
    const data = item.composite || {};
    const scores = data.scores || {};
    const names = Object.keys(scores);
    if (!names.length) {
      noteEl(host, "Held-out loss judges supervised training and misjudges DPO — DPO optimises " +
                   "the margin between chosen and rejected, not the likelihood of chosen alone, so " +
                   "a preference run can score worse here while being the better model. Preference " +
                   "accuracy judges DPO and says nothing about whether the model can still hold a " +
                   "conversation. This combines both: 40% fluency (held-out loss, scaled to the base " +
                   "model), 60% faithfulness (preference accuracy, weighted toward phone digits — " +
                   "the costliest detail to invent). A model below the phone-accuracy floor is capped " +
                   "regardless of everything else, matching the hard promotion gate rather than " +
                   "averaging past it.");
      return;
    }
    const complete = names.filter(n => scores[n].composite != null);
    const bestComposite = complete.length ? Math.max(...complete.map(n => scores[n].composite)) : null;
    const table = document.createElement("table");
    table.innerHTML =
      "<tr><th>model</th><th>fluency</th><th>faithful.</th><th>composite</th><th>phone acc.</th></tr>" +
      names.map(n => {
        const s = scores[n];
        const capped = s.phone_floor_breached;
        const compositeCell = s.composite == null ? "—" : s.composite.toFixed(1) + (capped ? " (capped)" : "");
        const phoneAcc = (s.corruption_breakdown || {}).phone;
        return `<tr><td>${n}</td>` +
          `<td>${s.fluency != null ? s.fluency.toFixed(1) : "—"}</td>` +
          `<td>${s.faithfulness != null ? s.faithfulness.toFixed(1) : "—"}</td>` +
          `<td class="${!capped && s.composite === bestComposite ? "best" : ""}${capped ? " warn" : ""}">${compositeCell}</td>` +
          `<td class="${phoneAcc != null && phoneAcc < (data.weights?.phone_floor ?? 0.6) ? "warn" : ""}">` +
          `${phoneAcc != null ? (phoneAcc * 100).toFixed(0) + "%" : "—"}</td></tr>`;
      }).join("");
    host.appendChild(table);
    const w = data.weights || {};
    noteEl(host, `Weights: fluency ${((w.fluency ?? 0.4) * 100).toFixed(0)}%, faithfulness ` +
                 `${((w.faithfulness ?? 0.6) * 100).toFixed(0)}%, phone floor ` +
                 `${((w.phone_floor ?? 0.6) * 100).toFixed(0)}%. A model under the phone floor is ` +
                 "capped regardless of its other numbers — a weighted average alone would let a bad " +
                 "phone number hide behind good ones everywhere else.");
  },

  hpsearch(host, item) {
    const s = item.search || {};
    if (!s.evaluated) {
      noteEl(host, "Six candidates per generation climb a ladder — everyone trains on 20 " +
                   "conversations, the best three on 60, the best two on all 189 — so a bad " +
                   "configuration costs twelve minutes instead of two hours. Three generations, " +
                   "roughly 21 hours.");
      return;
    }
    statGrid(host, [
      ["Evaluated", s.evaluated, "candidate runs"],
      ["Best so far", s.best ? s.best.score.toFixed(4) : "—",
       s.best ? `at ${s.best.conversations} convs` : ""],
      ["Phase", s.phase || "—", ""],
    ]);
    if (s.best && s.best.candidate) {
      const c = s.best.candidate;
      noteEl(host, `Leader: rank ${c.lora_rank}, α×${c.lora_alpha_ratio}, dropout ${c.lora_dropout}, ` +
                   `lr ${c.learning_rate}, accum ${c.gradient_accumulation_steps}` +
                   `${c.attention_only ? ", attention-only" : ""}. A ladder score ranks — it does ` +
                   "not predict the full-run loss.");
    }
  },
};

/* ---------- queue rendering ---------- */

const MARKS = { done: "✓", running: "▸", waiting: "·", partial: "◐", failed: "✕" };

function renderQueue() {
  const host = el("queue");
  host.replaceChildren();

  const finished = queueData.filter(i => i.state === "done").length;
  const btn = el("showdone");
  btn.textContent = (showDone ? "hide completed" : "show completed") + ` (${finished})`;
  btn.setAttribute("aria-pressed", String(showDone));

  for (const item of queueData) {
    if (item.state === "done" && !showDone) continue;

    const row = document.createElement("div");
    row.className = `item ${item.state}` + (open.has(item.id) ? " open" : "");

    const head = document.createElement("button");
    head.className = "item-head";
    head.setAttribute("aria-expanded", String(open.has(item.id)));
    head.innerHTML =
      `<span class="mark">${MARKS[item.state] || "·"}</span>` +
      `<span class="t">${item.title}<small>${item.sub || ""}</small></span>` +
      `<span class="state">${item.state}</span>` +
      `<span class="chev">›</span>`;
    head.addEventListener("click", () => {
      open.has(item.id) ? open.delete(item.id) : open.add(item.id);
      localStorage.setItem("ethos-open", JSON.stringify([...open]));
      renderQueue();
    });
    row.appendChild(head);

    if (open.has(item.id)) {
      const body = document.createElement("div");
      body.className = "item-body";
      (RENDER[item.kind] || (() => {}))(body, item);
      if (!body.children.length) noteEl(body, "Nothing recorded for this yet.");
      addTerminal(body, item.id);
      row.appendChild(body);
    }
    host.appendChild(row);
  }

  if (!host.children.length) {
    const p = document.createElement("p");
    p.className = "note";
    p.style.padding = ".5rem .3rem";
    p.textContent = `All ${finished} items are complete — use "show completed" to see them.`;
    host.appendChild(p);
  }
}

/* ---------- terminal view ---------- */

const termOpen = new Set(JSON.parse(localStorage.getItem("ethos-term") || "[]"));

function addTerminal(host, id) {
  const btn = document.createElement("button");
  btn.className = "term-btn";
  btn.setAttribute("aria-pressed", String(termOpen.has(id)));
  btn.textContent = termOpen.has(id) ? "hide terminal" : "show terminal";
  host.appendChild(btn);

  const pre = document.createElement("pre");
  pre.className = "term";
  pre.hidden = !termOpen.has(id);
  pre.textContent = "…";
  host.appendChild(pre);

  const load = async () => {
    if (!document.body.contains(pre)) { termLoaders.delete(id); return; }
    try {
      const response = await fetch(`/terminal?id=${encodeURIComponent(id)}`, { cache: "no-store" });
      const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
      pre.textContent = await response.text();
      // Follow the tail like a terminal would, but stop following the moment the reader
      // scrolls up to look at something.
      if (atBottom) pre.scrollTop = pre.scrollHeight;
    } catch { pre.textContent = "(could not load the log)"; }
  };
  termLoaders.set(id, load);
  if (termOpen.has(id)) load();

  btn.addEventListener("click", event => {
    event.stopPropagation();
    const now = !termOpen.has(id);
    now ? termOpen.add(id) : termOpen.delete(id);
    localStorage.setItem("ethos-term", JSON.stringify([...termOpen]));
    btn.setAttribute("aria-pressed", String(now));
    btn.textContent = now ? "hide terminal" : "show terminal";
    pre.hidden = !now;
    if (now) load();
  });
}

// Open terminals refresh with the poll, so a live log scrolls rather than freezes.
const termLoaders = new Map();
setInterval(() => {
  for (const [id, load] of termLoaders) {
    if (termOpen.has(id)) load();
  }
}, POLL_MS);

el("showdone").addEventListener("click", () => {
  showDone = !showDone;
  localStorage.setItem("ethos-showdone", showDone ? "1" : "0");
  renderQueue();
});

/* ---------- polling ---------- */

function markFreshness() {
  if (!lastFetch) return;
  const age = Math.round((Date.now() - lastFetch) / 1000);
  const node = el("freshness");
  node.textContent = age < 5 ? "updated just now" : `updated ${age}s ago`;
  node.classList.toggle("stale", age > POLL_MS / 1000 * 2.5);
}

async function poll() {
  try {
    const response = await fetch("/data.json", { cache: "no-store" });
    if (!response.ok) throw new Error(response.status);
    const data = await response.json();
    lastFetch = Date.now();
    queueData = data.queue || [];

    const running = queueData.find(i => i.state === "running");
    const pill = el("livepill");
    pill.classList.toggle("stopped", !running);
    el("livetext").textContent = running ? running.title.split(" — ")[0] : "Idle";

    renderQueue();
  } catch (error) {
    el("freshness").classList.add("stale");
    el("freshness").textContent = "server unreachable — retrying";
  }
  markFreshness();
}

poll();
setInterval(poll, POLL_MS);
setInterval(markFreshness, 1000);
</script>
</body>
